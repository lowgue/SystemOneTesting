[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "systemone-testing"
version = "0.2.0"
description = "Portable, evidence-preserving visual model comparisons"
requires-python = ">=3.12"
dependencies = ["Pillow>=12.3,<13", "numpy>=2.5,<3", "psutil>=7.2,<8", "matplotlib>=3.11,<4"]

[project.optional-dependencies]
web = ["fastapi==0.162.0", "uvicorn==0.54.0"]

[project.scripts]
vision-bench = "vision_bench.cli:main"
vision-web = "vision_bench.webui.api:main"

[tool.setuptools.packages.find]
include = ["vision_bench*"]

[tool.setuptools.package-data]
"vision_bench.webui" = ["static/*.html", "static/*.css", "static/*.js"]
